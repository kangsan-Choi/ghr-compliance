# main 브랜치에 올라오면 web/ 폴더를 GitHub Pages 로 자동 배포한다.
# 배포 전에 법령 데이터 구조를 검사하고 web/data.js 를 최신 data/*.json 으로 다시 만든다.
name: 웹 앱 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 법령 데이터 검사 · 앱에 반영
        run: |
          python tools/validate_data.py
          python tools/sync_web_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
